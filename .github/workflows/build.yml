name: Build & Release APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Сборка и публикация APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -di > release-key.jks

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload APK to hosting
        id: upload_apk
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          
          if [[ ! -f "$APK_PATH" ]]; then
            echo "❌ Файл не найден: $APK_PATH"
            exit 1
          fi
          
          SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "📦 Размер APK: $SIZE"
          
          # Вариант 1: file.io
          echo ""
          echo "=== Пробуем file.io ==="
          RESPONSE=$(curl -s -w "\n%{http_code}" -F "file=@$APK_PATH" https://file.io)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          echo "HTTP: $HTTP_CODE"
          echo "Ответ: $BODY"
          
          if [[ "$HTTP_CODE" == "200" ]]; then
            URL=$(echo "$BODY" | grep -o '"link":"[^"]*"' | cut -d'"' -f4)
            if [[ -n "$URL" ]]; then
              echo "✅ Успех: $URL"
              echo "download_url=$URL" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          
          # Вариант 2: bashupload.com
          echo ""
          echo "=== Пробуем bashupload.com ==="
          URL=$(curl -s -T "$APK_PATH" https://bashupload.com/app-release.apk)
          echo "Ответ: $URL"
          
          if [[ "$URL" == http* ]]; then
            # bashupload возвращает текст с ссылкой, извлекаем её
            LINK=$(echo "$URL" | grep -o 'https://bashupload.com/[a-zA-Z0-9]*' | head -1)
            if [[ -n "$LINK" ]]; then
              echo "✅ Успех: $LINK"
              echo "download_url=$LINK" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          
          # Вариант 3: litterbox.catbox.moe (временный)
          echo ""
          echo "=== Пробуем litterbox.catbox.moe ==="
          URL=$(curl -s \
            -F "reqtype=fileupload" \
            -F "time=72h" \
            -F "fileToUpload=@$APK_PATH" \
            https://litterbox.catbox.moe/resources/internals/api.php)
          echo "Ответ: $URL"
          
          if [[ "$URL" == *"https://litter.catbox.moe/"* ]]; then
            echo "✅ Успех: $URL"
            echo "download_url=$URL" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Вариант 4: catbox.moe с userhash
          echo ""
          echo "=== Пробуем catbox.moe с userhash ==="
          URL=$(curl -s \
            -F "reqtype=fileupload" \
            -F "userhash=" \
            -F "fileToUpload=@$APK_PATH" \
            https://catbox.moe/user/api.php)
          echo "Ответ: $URL"
          
          if [[ "$URL" == *"https://files.catbox.moe/"* ]]; then
            echo "✅ Успех: $URL"
            echo "download_url=$URL" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo ""
          echo "❌ Все сервисы не сработали"
          exit 1

      - name: Send download link to Telegram
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 **Calculator** — новая сборка готова!
            
            **Версия/ветка:** ${{ github.ref_name }}
            **Автор:** ${{ github.actor }}
            **Коммит:** `${{ github.sha }}`
            
            📥 **Скачать APK:**
            ${{ steps.upload_apk.outputs.download_url }}
            
            ⏰ Ссылка временная — скачай скорее!