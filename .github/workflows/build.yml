name: Build & Release APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Сборка и публикация APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -di > release-key.jks

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Calculator ${{ github.ref_name }}
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK to hosting
        id: upload_apk
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          
          # Проверяем существование файла
          if [[ ! -f "$APK_PATH" ]]; then
            echo "❌ Файл не найден: $APK_PATH"
            ls -la app/build/outputs/apk/release/ || echo "Папка не найдена"
            exit 1
          fi
          
          # Выводим размер файла
          SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "📦 Размер APK: $SIZE"
          
          # Пробуем загрузить на 0x0.st (более надёжный)
          echo "🚀 Загружаем на 0x0.st..."
          URL=$(curl -s -F "file=@$APK_PATH" https://0x0.st)
          
          if [[ "$URL" == http* ]]; then
            echo "✅ APK загружен: $URL"
            echo "download_url=$URL" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "⚠️ 0x0.st не сработал, пробуем catbox.moe..."
          
          # Запасной вариант: catbox.moe с User-Agent
          URL=$(curl -s \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36" \
            -F "reqtype=fileupload" \
            -F "fileToUpload=@$APK_PATH" \
            https://catbox.moe/user/api.php)
          
          if [[ "$URL" == *"https://files.catbox.moe/"* ]]; then
            echo "✅ APK загружен: $URL"
            echo "download_url=$URL" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "❌ Ошибка загрузки. Ответ: $URL"
          exit 1

      - name: Send download link to Telegram
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 **Calculator** — новая сборка готова!
            
            **Версия/ветка:** ${{ github.ref_name }}
            **Автор:** ${{ github.actor }}
            **Коммит:** `${{ github.sha }}`
            
            📥 **Скачать APK:**
            ${{ steps.upload_apk.outputs.download_url }}
            
            ⏰ Ссылка активна ограниченное время — скачай скорее!