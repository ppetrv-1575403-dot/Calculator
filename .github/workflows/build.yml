name: Build & Release APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Сборка и публикация APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -di > release-key.jks

      - name: Build Debug APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # Получаем размер APK
      - name: Get APK size
        id: apk_size
        run: |
          SIZE=$(stat -c%s "app/build/outputs/apk/release/app-release.apk" || stat -f%z "app/build/outputs/apk/release/app-release.apk")
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "size_mb=$SIZE_MB" >> $GITHUB_OUTPUT
          echo "APK size: ${SIZE_MB} MB"

      # Определяем тег и название релиза
      - name: Set release info
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            NAME="Calculator ${{ github.ref_name }}"
            PRERELEASE="false"
          else
            TAG="nightly"
            NAME="Calculator — nightly build"
            PRERELEASE="true"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "Release: $TAG — $NAME"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # Создаём/обновляем GitHub Release
      - name: Create/Update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.name }}
          artifacts: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          allowUpdates: true
          replacesArtifacts: true
          prerelease: ${{ steps.release_info.outputs.prerelease }}
          generateReleaseNotes: false
          body: |
            ## Calculator — новая сборка
            
            **Версия/ветка:** ${{ github.ref_name }}
            **Автор:** ${{ github.actor }}
            **Коммит:** ${{ github.sha }}
            **Размер APK:** ${{ steps.apk_size.outputs.size_mb }} MB
            
            Прямая ссылка на APK:
            ```
            ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.tag }}/app-release.apk
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Формируем прямую ссылку на APK
      - name: Set APK download URL
        id: apk_url
        run: |
          URL="${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.tag }}/app-release.apk"
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "APK URL: $URL"

      # Отправляем файл напрямую, если размер < 49 МБ
      - name: Send APK to Telegram (small file)
        if: success() && steps.apk_size.outputs.size_mb < 49
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          document: app/build/outputs/apk/release/app-release.apk
          message: |
            📱 **Calculator** — новая сборка готова!
            
            **Версия/ветка:** ${{ github.ref_name }}
            **Автор:** ${{ github.actor }}
            **Размер:** ${{ steps.apk_size.outputs.size_mb }} MB
            
            🔗 Прямая ссылка:
            ${{ steps.apk_url.outputs.url }}

      # Отправляем ссылку, если файл > 50 МБ (лимит Telegram Bot API)
      - name: Send link to Telegram (large file)
        if: success() && steps.apk_size.outputs.size_mb >= 49
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            📱 **Calculator** — новая сборка готова!
            
            **Версия/ветка:** ${{ github.ref_name }}
            **Автор:** ${{ github.actor }}
            **Размер:** ${{ steps.apk_size.outputs.size_mb }} MB
            
            ⚠️ Файл больше 50 MB — скачивайте по прямой ссылке:
            🔗 ${{ steps.apk_url.outputs.url }}
            
            Все релизы: ${{ github.server_url }}/${{ github.repository }}/releases