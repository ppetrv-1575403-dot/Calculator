name: Build & Release APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Сборка и публикация APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -di > release-key.jks

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create Pre-release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: Dev Build ${{ github.run_number }}
          tag_name: dev-${{ github.run_number }}
          prerelease: true
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get APK URL
        id: get_url
        run: |
          APK_NAME=$(ls app/build/outputs/apk/release/*.apk | xargs -n 1 basename)
          URL="${{ github.server_url }}/${{ github.repository }}/releases/download/dev-${{ github.run_number }}/${APK_NAME}"
          echo "download_url=$URL" >> $GITHUB_OUTPUT
          echo "📥 URL: $URL"

      - name: Send download link to Telegram
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 **Calculator** — новая сборка готова!
            
            **Версия/ветка:** ${{ github.ref_name }}
            **Автор:** ${{ github.actor }}
            **Коммит:** `${{ github.sha }}`
            
            📥 **Скачать APK:**
            ${{ steps.get_url.outputs.download_url }}
            
            🔗 Прямая ссылка (GitHub Releases)
            📂 Все релизы: ${{ github.server_url }}/${{ github.repository }}/releases